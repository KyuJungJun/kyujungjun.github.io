<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-label="Screening funnel: large structure databases are filtered by stability, machine-learning predictions, and first-principles calculations before candidates go to synthesis and testing" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title>Screening funnel: large structure databases are filtered by stability, machine-learning predictions, and first-principles calculations before candidates go to synthesis and testing</title>
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
</defs>
<rect width="600" height="420" fill="#ffffff"/>
<polygon points="40.0,30.0 560.0,30.0 520.0,94.0 80.0,94.0" fill="#e5e7eb"/>
<text x="300" y="58" font-size="15" font-weight="700" fill="#111827" text-anchor="middle" >Structure databases</text>
<text x="300" y="77" font-size="12" font-weight="500" fill="#4b5563" text-anchor="middle" >Materials Project, ICSD</text>
<polygon points="80.0,100.0 520.0,100.0 480.0,164.0 120.0,164.0" fill="#d1d5db"/>
<text x="300" y="128" font-size="15" font-weight="700" fill="#111827" text-anchor="middle" >Thermodynamic stability</text>
<text x="300" y="147" font-size="12" font-weight="500" fill="#4b5563" text-anchor="middle" >energy above hull</text>
<polygon points="120.0,170.0 480.0,170.0 440.0,234.0 160.0,234.0" fill="#9ca3af"/>
<text x="300" y="198" font-size="15" font-weight="700" fill="#111827" text-anchor="middle" >Machine-learning screening</text>
<text x="300" y="217" font-size="12" font-weight="500" fill="#4b5563" text-anchor="middle" >conductivity, stability</text>
<polygon points="160.0,240.0 440.0,240.0 400.0,304.0 200.0,304.0" fill="#4b5563"/>
<text x="300" y="268" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" >First-principles validation</text>
<text x="300" y="287" font-size="12" font-weight="500" fill="#ffffff" text-anchor="middle" >DFT, ab initio MD</text>
<line x1="300" y1="308" x2="300" y2="334" stroke="#111827" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ai)" opacity="1"/>
<rect x="150" y="338" width="300" height="52" rx="10" fill="#F59E0B" stroke="none" stroke-width="1.5" opacity="1"/>
<text x="300" y="362" font-size="15" font-weight="800" fill="#111827" text-anchor="middle" >Synthesis and testing</text>
<text x="300" y="380" font-size="12" font-weight="600" fill="#111827" text-anchor="middle" >with experimental groups</text>
<line x1="52" y1="40" x2="52" y2="300" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ai)" opacity="1"/>
<text x="38" y="170" font-size="12" font-weight="600" fill="#4b5563" text-anchor="middle" transform="rotate(-90 38 170)">fewer candidates</text>
<line x1="548" y1="300" x2="548" y2="40" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" marker-end="url(#aa)" opacity="1"/>
<text x="566" y="170" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle" transform="rotate(90 566 170)">higher cost per compound</text>
</svg>
