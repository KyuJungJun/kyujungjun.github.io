<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="MINDS Lab logo">
  <title>MINDS Lab</title>
  <!-- Weight-gradient edges (charcoal, varying stroke-width / opacity to evoke a learned neural network weight distribution) -->
  <g stroke="#1f2937" stroke-linecap="round" fill="none">
    <line x1="28" y1="30" x2="18" y2="88" stroke-width="0.5" opacity="0.18"/>
    <line x1="95" y1="28" x2="18" y2="88" stroke-width="0.5" opacity="0.15"/>
    <line x1="102" y1="72" x2="18" y2="88" stroke-width="0.5" opacity="0.2"/>
    <line x1="28" y1="30" x2="75" y2="103" stroke-width="0.5" opacity="0.18"/>
    <line x1="28" y1="30" x2="95" y2="28" stroke-width="0.8" opacity="0.3"/>
    <line x1="95" y1="28" x2="75" y2="103" stroke-width="0.8" opacity="0.3"/>
    <line x1="28" y1="30" x2="102" y2="72" stroke-width="0.7" opacity="0.25"/>
    <line x1="75" y1="103" x2="18" y2="88" stroke-width="0.8" opacity="0.32"/>
    <line x1="102" y1="72" x2="75" y2="103" stroke-width="0.9" opacity="0.35"/>
    <line x1="95" y1="28" x2="102" y2="72" stroke-width="1.2" opacity="0.5"/>
    <line x1="58" y1="60" x2="18" y2="88" stroke-width="1.1" opacity="0.45"/>
    <line x1="58" y1="60" x2="75" y2="103" stroke-width="1.3" opacity="0.55"/>
    <line x1="58" y1="60" x2="95" y2="28" stroke-width="1.8" opacity="0.75"/>
  </g>
  <!-- Strongest 2 edges in amber accent -->
  <line x1="58" y1="60" x2="28" y2="30" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="58" y1="60" x2="102" y2="72" stroke="#f59e0b" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Outer atom nodes -->
  <g fill="#1f2937">
    <circle cx="28" cy="30" r="5"/>
    <circle cx="95" cy="28" r="5"/>
    <circle cx="102" cy="72" r="5"/>
    <circle cx="75" cy="103" r="5"/>
    <circle cx="18" cy="88" r="5"/>
  </g>
  <!-- Central Li ion with halo -->
  <circle cx="58" cy="60" r="13" fill="#f59e0b" opacity="0.2"/>
  <circle cx="58" cy="60" r="8.5" fill="#f59e0b"/>
</svg>
