<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1010" width="600" height="1010" role="img" aria-label="High-throughput materials search. Screening funnel: structure databases are filtered by stability, machine-learning predictions and first-principles calculations before synthesis and testing" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title>High-throughput materials search</title>
<rect width="600" height="1010" fill="#ffffff"/>
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
</defs>
<text x="30" y="52" font-size="26" font-weight="800" fill="#111827" letter-spacing="-0.5">High-throughput materials search</text>
<rect x="30" y="66" width="44" height="4" fill="#F59E0B"/>
<text x="30" y="112" font-size="16" font-weight="700" fill="#4b5563" xml:space="preserve">Screening funnel from databases to synthesis</text>
<polygon points="50.0,160.0 550.0,160.0 516.2,313.0 83.8,313.0" fill="#e5e7eb"/>
<text x="300" y="234.5" font-size="18" font-weight="700" fill="#111827" text-anchor="middle" >Structure databases</text>
<text x="300" y="258.5" font-size="14" font-weight="500" fill="#4b5563" text-anchor="middle" >Materials Project, ICSD</text>
<polygon points="83.8,325.0 516.2,325.0 482.5,478.0 117.5,478.0" fill="#d1d5db"/>
<text x="300" y="399.5" font-size="18" font-weight="700" fill="#111827" text-anchor="middle" >Thermodynamic stability</text>
<text x="300" y="423.5" font-size="14" font-weight="500" fill="#4b5563" text-anchor="middle" >energy above hull</text>
<polygon points="117.5,490.0 482.5,490.0 448.8,643.0 151.2,643.0" fill="#9ca3af"/>
<text x="300" y="564.5" font-size="18" font-weight="700" fill="#111827" text-anchor="middle" >Machine-learning screening</text>
<text x="300" y="588.5" font-size="14" font-weight="500" fill="#4b5563" text-anchor="middle" >conductivity, stability</text>
<polygon points="151.2,655.0 448.8,655.0 415.0,808.0 185.0,808.0" fill="#4b5563"/>
<text x="300" y="729.5" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" >First-principles validation</text>
<text x="300" y="753.5" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle" >DFT, ab initio MD</text>
<line x1="300" y1="816" x2="300" y2="858" stroke="#111827" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ai)" opacity="1"/>
<rect x="140" y="866" width="320" height="70" rx="12" fill="#F59E0B" stroke="none" stroke-width="1.5" opacity="1"/>
<text x="300" y="898" font-size="18" font-weight="800" fill="#111827" text-anchor="middle" >Synthesis and testing</text>
<text x="300" y="921" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" >with experimental groups</text>
<line x1="40" y1="170" x2="40" y2="808" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ai)" opacity="1"/>
<text x="26" y="484.0" font-size="14" font-weight="600" fill="#4b5563" text-anchor="middle" transform="rotate(-90 26 484.0)">fewer candidates</text>
<line x1="560" y1="808" x2="560" y2="170" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" marker-end="url(#aa)" opacity="1"/>
<text x="576" y="484.0" font-size="14" font-weight="600" fill="#b45309" text-anchor="middle" transform="rotate(90 576 484.0)">higher cost per compound</text>
</svg>
